name: Create Release

on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

permissions:
  contents: write

jobs:
  release:
    name: Build and Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleDebug --no-daemon # Building debug for now as release needs signing keys

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          name: TrueHiFi ${{ github.ref_name }}
          body: |
            ## What's New in ${{ github.ref_name }}
            
            🚀 **Performance**: Parallel scanning (3x faster).
            🔍 **Deep Zoom**: Interactive zoom on spectrograms.
            📊 **Dynamic Range**: Professional DR Metering (DR1-20).
            📂 **Folder Scanning**: SAF support for USB/SD and specific folders.
            ☁️ **Community**: Cloud-powered fake detection.
            📜 **Certificates**: Shareable verification reports.
            🧹 **Safe Cleanup**: Move to System Trash support.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
